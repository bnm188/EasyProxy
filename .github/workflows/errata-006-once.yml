name: errata-006-once

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  errata:
    if: contains(github.event.head_commit.message, '[errata006]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert the errata pointer into report 006 and remove this workflow
        run: |
          set -euo pipefail
          python3 -c 'import io; p="docs/reports/006-2026-11-17-release-0.7.0.md"; t=io.open(p,encoding="utf-8").read().split("\n"); t.insert(1, ""); t.insert(2, "> **勘误（2026-11-17，报告 007）**：第 1 节第 11 行与第 5 节所述 `runlog.txt` 的删除当时并未生效，该文件实际由提交 `a8e5c4e` 删除；发布后独立复核结论见 [007-2026-11-17-post-release-verification.md](007-2026-11-17-post-release-verification.md)。"); io.open(p,"w",encoding="utf-8").write("\n".join(t))'
          rm -f .github/workflows/errata-006-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: 006 报告头部追加勘误指向（runlog.txt 实际删除提交 a8e5c4e）'
          git push origin HEAD:main
