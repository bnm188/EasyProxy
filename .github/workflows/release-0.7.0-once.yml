name: Release 0.7.0 once

# 一次性发布工作流：本机没有 GitHub 写凭据，连接器也没有建 tag / 建 Release 的接口，
# 因此用这一次受控运行把已审阅的补丁落地、跑完全套测试与构建，
# 并在通过后创建 v0.7.0 的真实 Release。落地提交里会删掉本工作流，
# 所以它不会影响后续 tag-only 的发布策略。

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  issues: write

jobs:
  release:
    name: Apply 0.7.0 and publish
    if: github.repository == 'bnm188/EasyProxy'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout EasyProxy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch, test, build and publish
        shell: bash
        run: |
          set -o pipefail
          bash .github/release-070.sh 2>&1 | tee runlog.txt

      - name: Report failure as an issue
        if: failure()
        run: |
          {
            echo "run: $GITHUB_RUN_ID  sha: $GITHUB_SHA"
            echo ''
            echo '--- log tail ---'
            echo ''
            tail -c 8000 runlog.txt 2>/dev/null | sed -e 's/^/| /' || echo 'no runlog.txt'
          } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "release 0.7.0 run $GITHUB_RUN_ID failed" \
            --body-file body.md || echo "issue create failed"

      - name: Upload logs and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easyproxy-070-runlog
          path: |
            runlog.txt
            test-logs/*
          if-no-files-found: warn
          retention-days: 30
