
name: EasyProxy x86_64 package build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ImmortalWrt 25.12.2 x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout EasyProxy
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget curl zstd

      - name: Download official ImmortalWrt SDK
        run: |
          set -euo pipefail
          SDK_URL="https://downloads.immortalwrt.org/releases/25.12.2/targets/x86/64/immortalwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          SDK_SHA="4d4631f134c2f27215a91aa7ef5bf9a01ea96c2450d3b8a5c38048c32462ac60"

          curl -fL "$SDK_URL" -o sdk.tar.zst
          echo "$SDK_SHA  sdk.tar.zst" | sha256sum -c -

          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Build EasyProxy
        run: |
          set -euo pipefail
          cd sdk
          mkdir -p package/easyproxy
          cp -a ../package/easyproxy/. package/easyproxy/
          make defconfig
          make package/easyproxy/compile V=s -j2

      - name: Collect packages
        run: |
          set -euo pipefail
          mkdir -p dist
          find sdk/bin/packages -type f \
            \( -name 'easyproxy*.apk' -o -name 'easyproxy*.ipk' \) \
            -exec cp -v {} dist/ \;

          if ! compgen -G 'dist/easyproxy*' > /dev/null; then
            echo "::error::EasyProxy package not found"
            exit 1
          fi

          sha256sum dist/* | tee dist/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyproxy-immortalwrt-25.12.2-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
