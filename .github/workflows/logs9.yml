name: logs9
on:
  push:
    paths:
      - .github/workflows/logs9.yml
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: fetch the failed run log and publish it as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run view 43955772351 --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/f.txt 2>/tmp/err.txt
          rc=$?
          if [ ! -s /tmp/f.txt ]; then gh run view 43955772351 --repo "$GITHUB_REPOSITORY" --log > /tmp/f.txt 2>>/tmp/err.txt; fi
          echo "rc=$rc err:" > /tmp/out.txt
          cat /tmp/err.txt >> /tmp/out.txt
          echo "--- workflow commands (errors) ---" >> /tmp/out.txt
          grep -E '##\[error\]|::error' /tmp/f.txt >> /tmp/out.txt
          echo "--- last 200 log lines ---" >> /tmp/out.txt
          tail -n 200 /tmp/f.txt >> /tmp/out.txt
          wc -c /tmp/out.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "logs9 build failure" --body-file /tmp/out.txt || true
