name: docs 0.7.0 once

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply:
    name: Apply the reviewed docs patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply, commit and push
        run: |
          set -euo pipefail
          if [ -f docs/reports/006-2026-11-17-release-0.7.0.md ]; then
            echo "docs already applied on main, nothing to do"
            exit 0
          fi
          URL="https://aka.doubaocdn.com/s/kwiIRmfWOj"
          SHA="0194c6f2ee1bdd9f37abf13a7931335c728810573b1c34bc578b2c336ce333fb"
          curl -fsSL --retry 3 "$URL" -o /tmp/docs.patch || { echo "::error title=download::cannot download the docs patch"; exit 1; }
          echo "$SHA  /tmp/docs.patch" | sha256sum -c - || { echo "::error title=checksum::docs patch is not the reviewed one"; exit 1; }
          git apply --check /tmp/docs.patch || { echo "::error title=apply::docs patch does not apply"; exit 1; }
          git apply /tmp/docs.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: 006 报告 + PROJECT-STATUS/DEVELOPMENT-PLAN/README 同步到 0.7.0"
          git push origin HEAD:main
          echo "docs commit pushed: $(git rev-parse HEAD)"
