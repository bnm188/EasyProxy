name: docs-008-once2
on:
  push:
    paths:
      - .github/workflows/docs-008-once2.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: decode payload from the previous workflow file and apply the 008 docs patch
        run: |
          set -e
          python3 - <<'PY'
          src = open('.github/workflows/docs-008-once.yml').read()
          body = src.split("<<'B64'\n", 1)[1].split("\nB64", 1)[0]
          open('/tmp/docs.patch.xz.b64', 'w').write(''.join(body.split()))
          PY
          base64 -d /tmp/docs.patch.xz.b64 > /tmp/docs.patch.xz
          echo '2df75d7a72a6fcf8165107acd8600ddacbd1d2dc85441aefab6891961cbd8b7d  /tmp/docs.patch' > /tmp/docs.sha
          xz -dc /tmp/docs.patch.xz > /tmp/docs.patch
          sha256sum -c /tmp/docs.sha
          git apply --verbose /tmp/docs.patch
          git add docs/reports/008-2026-11-17-kwrt-firmware-compat.md
          git rm -f .github/workflows/docs-008-once.yml .github/workflows/docs-008-once2.yml
          git -c user.name='EasyProxy Bot' -c user.email='bot@users.noreply.github.com' commit -am 'docs: 008 报告（Kwrt 固件识别兼容性修复）+ 索引行 + 状态更新'
          git push
