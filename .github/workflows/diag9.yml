name: diag9
on:
  push:
    paths:
      - .github/workflows/diag9.yml
permissions:
  contents: write
  actions: write
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe push and dispatch, report through an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "event: ${GITHUB_EVENT_NAME} ref: ${GITHUB_REF} ref_type: ${GITHUB_REF_TYPE} name: ${GITHUB_REF_NAME}"
            echo "branch: $(git rev-parse --abbrev-ref HEAD)"
            echo "--- git push --dry-run ---"
            git push --dry-run origin HEAD:main 2>&1; echo "rc=$?"
            echo "--- gh workflow list ---"
            gh workflow list --repo "$GITHUB_REPOSITORY" 2>&1 | head -5
            echo "--- gh workflow run ---"
            gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=0.8.0 2>&1; echo "rc=$?"
            sleep 5
            echo "--- gh run list ---"
            gh run list --repo "$GITHUB_REPOSITORY" --limit 3 2>&1
          } > /tmp/diag.txt 2>&1
          git -c user.name='EasyProxy Bot' -c user.email='bot@users.noreply.github.com' commit --allow-empty -m 'chore(diag): probe'
          git push origin HEAD:main 2>>/tmp/diag.txt
          echo "push rc=$?" >> /tmp/diag.txt
          cat /tmp/diag.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "diag9 probe" --body-file /tmp/diag.txt || true
