name: docs-008-amend
on:
  push:
    paths:
      - .github/workflows/docs-008-amend.yml
permissions:
  contents: write
jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: amend report 008 with the docs commit, CI evidence and the yaml failure
        run: |
          set -e
          python3 - <<'PY'
          p = 'docs/reports/008-2026-11-17-kwrt-firmware-compat.md'
          s = open(p, encoding='utf-8').read()

          row3 = s.index('| 3 | 一次性工作流 `kwrt-fix-once.yml` 第 2 次运行')
          row_end = s.index('\n', row3) + 1
          row4 = ('| 4 | 一次性文档工作流 `docs-008-once.yml` #1 **failed**（Actions 页可见，`0 jobs`） '
                  '| 我把 xz+base64 载荷写进 YAML 时没有按 `run: |` 块缩进，heredoc 内容顶格，'
                  '工作流文件语法无效，GitHub 判为无效工作流、未产生任何 job '
                  '| 新增 `docs-008-once2.yml`：不再重发载荷，改为从已推送的 `docs-008-once.yml` 里提取 base64 解码'
                  '（补丁 `sha256sum -c` 校验 `2df75d7a…` 通过）后 `git apply`，两个工作流在同一提交内自删 |\n')
          s = s[:row_end] + row4 + s[row_end:]

          old_ci = '- CI：仓库 `build.yml` 会在 push `main` 时跑（构建 + 打包 + 校验），其结论以 Actions 页为准；**本轮不以 CI 结论代替本地测试结论**（CI 状态见第 9 节记录时点）。'
          new_ci = ('- CI（实查 Actions 页，2026-11-17）：`EasyProxy package and kernel build` **#156（`6fb2a14`）SUCCESS**、'
                    '**#157（`2ab2cc8`）SUCCESS**；两个提交的树都含本次修复后的 `scripts/install.sh`。'
                    '**不以 CI 结论代替本地 591 通过 / 0 失败。**\n'
                    '- 说明：`5b84c2b`（代码）与 `670607a`（文档）是 `GITHUB_TOKEN` 在 Actions 内 `git push` 产生的，'
                    'GitHub 不为其再触发工作流，所以这两个 SHA **没有独立 build run**；'
                    '改以随后人工 push 的 `6fb2a14`/`2ab2cc8` 的 SUCCESS 作为覆盖同一份代码的 CI 证据。')
          assert old_ci in s
          s = s.replace(old_ci, new_ci)

          old_prod = '- 仓库产物：代码提交 `5b84c2b`（3 个文件实质修改 + 2 个一次性工作流删除），以及本报告与索引行。'
          new_prod = old_prod + '\n- 文档提交：`670607a`（008 报告 + 索引 008 行 + `docs/PROJECT-STATUS.md` 更新）已推送到 `main`。'
          assert old_prod in s
          s = s.replace(old_prod, new_prod)

          old_commit = '- 报告提交：本报告与 `docs/reports/README.md` 索引行、`docs/PROJECT-STATUS.md` 同一次提交；该提交 SHA 见 GitHub 提交历史（避免自引用）。'
          new_commit = ('- 报告提交：`670607a`（`docs: 008 报告（Kwrt 固件识别兼容性修复）+ 索引行 + 状态更新`），'
                        '同一提交含本报告、`docs/reports/README.md` 的 008 索引行与 `docs/PROJECT-STATUS.md` 更新；'
                        '推送后 `git fetch` 逐文件比对，远端与本地 `sha256sum` 一致（`da8310b8…`、`af28dc88…`、`b5ef6dc4…`）。')
          assert old_commit in s
          s = s.replace(old_commit, new_commit)

          open(p, 'w', encoding='utf-8').write(s)
          print('report amended')
          PY
          git rm -f .github/workflows/docs-008-amend.yml
          git -c user.name='EasyProxy Bot' -c user.email='bot@users.noreply.github.com' commit -am 'docs: 008 报告补记文档提交 SHA、CI 实查结论与工作流失败'
          git push
