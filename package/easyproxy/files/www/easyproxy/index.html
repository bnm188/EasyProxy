<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6d5cf5">
<title>EasyProxy 控制台</title>
<link rel="stylesheet" href="panel.css?v=20261119a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%234a7cff'/%3E%3Cellipse cx='50' cy='50' rx='46' ry='18' fill='none' stroke='%23fff' stroke-opacity='.35'/%3E%3C/svg%3E">
</head>
<body>

<div id="auth" class="auth-wrap hidden">
	<div class="auth-card">
		<div class="auth-logo"></div>
		<div class="auth-title" id="authTitle">EasyProxy</div>
		<div class="auth-sub" id="authSub">正在检查运行状态…</div>
		<form id="authForm" onsubmit="return false">
			<div class="auth-field">
				<label for="pw1">管理密码</label>
				<input class="input" id="pw1" type="password" autocomplete="current-password" placeholder="输入密码">
			</div>
			<div class="auth-field hidden" id="pw2Wrap">
				<label for="pw2">确认密码</label>
				<input class="input" id="pw2" type="password" autocomplete="new-password" placeholder="再次输入">
			</div>
			<button class="btn primary" id="authBtn" type="button" style="width:100%;height:40px;margin-top:6px">登录</button>
			<div class="notice err hidden" id="authErr" style="margin-top:12px"></div>
		</form>
		<div style="text-align:center;font-size:11.5px;color:var(--text-3);margin-top:16px">
			EasyProxy · 独立控制台
		</div>
	</div>
</div>

<div id="app" class="app hidden">
	<aside class="sidebar" id="sidebar">
		<div class="brand">
			<div class="brand-logo"></div>
			<div class="brand-text">
				<div class="brand-name">EasyProxy</div>
				<div class="brand-sub" id="brandSub">控制台</div>
			</div>
		</div>
		<nav class="nav" id="nav"></nav>
		<div class="side-foot">
			<span class="foot-text" id="footVer">v—</span>
			<button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
				<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
			</button>
			<button class="icon-btn" id="foldBtn" title="折叠侧栏" aria-label="折叠侧栏">
				<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
			</button>
			<button class="icon-btn" id="logoutBtn" title="退出登录" aria-label="退出登录">
				<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/><path d="M9 12h12"/></svg>
			</button>
		</div>
	</aside>

	<main class="main">
		<div class="topbar">
			<button class="icon-btn" id="foldBtn2" aria-label="菜单" style="display:none">
				<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
			</button>
			<div>
				<div class="page-title" id="pageTitle">概览</div>
				<div class="page-sub" id="pageSub">—</div>
			</div>
			<div class="topbar-grow"></div>
			<div class="chip mono" id="clock">—</div>
			<div class="chip" id="engineChip"><span class="dot"></span><span id="engineText">—</span></div>
		</div>
		<div class="content" id="content"></div>
	</main>

	<nav class="dock" id="dock"><div class="dock-inner" id="dockInner"></div></nav>
</div>

<div class="toast" id="toast"></div>

<script src="panel.js?v=20261119a"></script>
</body>
</html>
