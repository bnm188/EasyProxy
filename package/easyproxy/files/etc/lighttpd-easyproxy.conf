# EasyProxy 独立面板 —— lighttpd 实例配置
# 端口 8090，与 LuCI 的 nginx(80) 完全隔离，不改 /etc/nginx 任何文件。
# 注意：OpenWrt 的 lighttpd 包只带 mod_cgi / mod_dirlisting / mod_h2，
# 其它模块缺失时 lighttpd 会直接拒绝启动，所以这里只启用实际存在的。

server.modules = (
	"mod_cgi",
)

server.document-root        = "/www/easyproxy/"
server.port                 = 8090
server.bind                 = "0.0.0.0"

server.errorlog             = "/var/log/easyproxy-panel.log"
server.breakagelog          = "/var/log/easyproxy-panel-cgi.log"

server.max-request-size     = 65536
server.max-connections      = 64

index-file.names            = ( "index.html" )

cgi.assign                  = ( ".sh" => "/bin/sh" )
cgi.timeout                 = 30

mimetype.assign = (
	".html" => "text/html; charset=utf-8",
	".css"  => "text/css; charset=utf-8",
	".js"   => "application/javascript; charset=utf-8",
	".json" => "application/json; charset=utf-8",
	".svg"  => "image/svg+xml",
	".png"  => "image/png",
	".ico"  => "image/x-icon",
	".webmanifest" => "application/manifest+json",
	".woff2" => "font/woff2",
	""      => "application/octet-stream",
)

static-file.exclude-extensions = ( ".sh", ".inc", ".conf" )
